spring.application.name=eventbooking

spring.jpa.properties.hibernate.query.validator_strict_compliance=false

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${JWT_SECRET:CHANGE-ME-this-default-secret-must-be-overridden-in-real-deployments}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.com.isli=INFO